syntax = "proto3";

package pb_types.sst;

// Time range of [start, end)
message TimeRange {
  // inclusive
  int64 start = 1;
  // exclusive
  int64 end = 2;
}

message SstMeta {
  uint64 max_sequence = 1;
  uint32 num_rows = 2;
  uint32 size = 3;
  TimeRange time_range = 4;
  // Minimum `__seq__` in this file. A missing field reads as 0, which is safe
  // for legacy Parquet files.
  uint64 min_sequence = 5;
  // Data format of the referenced file. Defaults to PARQUET_V1 so that old
  // manifests and deltas keep describing Parquet SSTs.
  FileFormat format = 6;
}

enum FileFormat {
  PARQUET_V1 = 0;
  TSF_V1 = 1;
}

message SstFile {
  uint64 id = 1;
  SstMeta meta = 2;
}

message ManifestUpdate {
  repeated SstFile to_adds = 1;
  repeated uint64 to_deletes = 2;
}
